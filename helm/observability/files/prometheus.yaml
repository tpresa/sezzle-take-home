global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /otel-lgtm/rules.yaml

scrape_configs:
  # Scrape each pod directly. Scraping the Service would hit a random replica
  # per scrape, mixing counters from different pods.
  - job_name: weatherlookup
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
            - weatherlookup
        selectors:
          - role: pod
            label: app.kubernetes.io/name=weatherlookup
    relabel_configs:
      # One target per pod: the container port named "http".
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: http
        action: keep
      # Completed or pending pods have no live endpoint to scrape.
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - target_label: service
        replacement: weatherlookup
